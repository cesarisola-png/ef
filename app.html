V.home=async()=>{const L=await api('ef_familias?select=id,nombre,generacion,sector,ef_relevamientos(fecha,resultado)&order=created_at.desc');
 return `<div class="row"><h1 style="flex:1">Familias</h1><button onclick="logout()">Salir</button></div>`+(L.map(f=>{const r=f.ef_relevamientos.filter(x=>x.resultado).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];return `<div class="c fam" onclick="go('fam',{f:'${f.id}'})"><div class="row"><b style="flex:1">${esc(f.nombre)}</b>${r?bd(FL,r.resultado.lf)+bd(EL,r.resultado.le):'<span class="mu" style="flex:0">sin diagnóstico</span>'}</div><div class="mu">${esc([f.generacion&&f.generacion+' gen.',f.sector].filter(Boolean).join(' · '))}</div></div>`}).join('')||'<p class="mu">Todavía no hay familias.</p>')
 +`<details class="c"><summary><b>+ Nueva familia</b></summary><div class="row"><input id="nn" placeholder="Nombre"><select id="ng"><option>2da</option><option>3ra</option></select><input id="ns" placeholder="Sector"><input id="nu" placeholder="Ubicación"><button class="pr" onclick="nf()">Crear</button></div></details>`};
async function nf(){const n=$('#nn').value.trim();if(!n)return;await api('ef_familias',{method:'POST',body:JSON.stringify({nombre:n,generacion:$('#ng').value,sector:$('#ns').value,ubicacion:$('#nu').value})});go('home')}
V.fam=async()=>{const [f]=await api(`ef_familias?id=eq.${S.f}&select=*`),R=await api(`ef_relevamientos?familia_id=eq.${S.f}&select=id,fecha,estado,resultado&order=fecha.desc`);

 <p class="mu">Cada link es de un solo uso y vence a los 7 días. Los cortes por grupo y la brecha solo se muestran con 3 o más respondentes.</p></div>
 <details class="c np"><summary><b>Pesos de las dimensiones</b> <span class="mu">(estándar por defecto)</span></summary><p class="mu">Cada eje suma 100% (mín. 5%, máx. 50% por dimensión). Cambiarlos modifica el puntaje y puede mover la celda de la matriz y la acción. Si te apartás del estándar, la justificación es obligatoria (mín. 50 caracteres) y queda en el informe.</p>${[['Familia','wf',DF,wv(R)[0]],['Empresa','we',DE,wv(R)[1]]].map(([t,p,D,w])=>`<div class="mu" style="margin-top:8px"><b>${t}</b></div><div class="row">${D.map((d,i)=>`<label class="mu">${d[1]}<br><input id="${p}${i}" type="number" min="5" max="50" step="1" value="${Math.round(w[i]*100)}" style="width:70px"> %</label>`).join('')}</div>`).join('')}<textarea id="wj" rows="2" placeholder="Justificación (obligatoria si cambiás los pesos)" style="width:100%;box-sizing:border-box;margin-top:8px">${esc(R.resultado&&R.resultado.pj||'')}</textarea></details>

async function ap(){const r=$('#pr').value.trim();if(!r)return;await api('ef_respondentes',{method:'POST',body:JSON.stringify({relevamiento_id:S.r,eje:$('#pe').value,rol:r,grupo:$('#pg').value.trim()||null})});go('rel',{f:S.f,r:S.r})}
async function dp(id){await api('ef_respondentes?id=eq.'+id,{method:'DELETE'});go('rel',{f:S.f,r:S.r})}
function diag(P,A,pf,pe,ov){const rs=P.filter(p=>p.completado).map(p=>({e:p.eje,a:A[p.id]||{}})),nF=rs.filter(r=>r.e=='fam').length,nE=rs.length-nF;
 if(!nF||!nE)throw new Error('Hace falta al menos un respondente completo en cada eje.');
 const dim=(e,D)=>D.map(([k])=>{const per=rs.filter(r=>r.e==e).map(r=>av([1,2,3,4,5].map(i=>{const id=e+'_'+k+'_0'+i;return nv(r.a[id],INV.includes(id))})));return{s:av(per),b:per.length>=3?Math.max(...per)-Math.min(...per):0}});
 const F=dim('fam',DF),E=dim('emp',DE),ws=(X,w)=>X.reduce((a,x,i)=>a+x.s*w[i],0),sf=ws(F,pf),se=ws(E,pe),br=nF>=3?av(F.map(x=>x.b)):null,lf0=lv(sf),le0=lv(se),lf=ov&&ov.lf!=null?ov.lf:lf0,le=ov&&ov.le!=null?ov.le:le0,any=(id,v)=>rs.some(r=>r.a[id]===v),ru=[];
 if(br!==null&&br>40)ru.push(0);if(E[3].s<30&&E[2].s<30)ru.push(1);if(any('fam_reg_05',1)&&lf==0)ru.push(2);if(any('fam_gen_01',1)&&le!=0)ru.push(3);
 const cut=x=>[34,67].some(c=>Math.abs(x-c)<3);return{sf,se,br,F,E,lf,le,lf0,le0,ov:ov||null,pf,pe,lfd:lv(ws(F,WF0)),led:lv(ws(E,WE0)),nc:[cut(sf),cut(se)],ru,nF,nE,ac:M[lf][le],ex:ru.map(i=>RU[i])}}
const wv=R=>[(R.pesos_familia||WF0).map(Number),(R.pesos_empresa||WE0).map(Number)],pc=a=>a.map(x=>Math.round(x*100)),eqw=(a,b)=>a.length==b.length&&a.every((x,i)=>Math.abs(x-b[i])<.0005),gp=(p,n)=>Array.from({length:n},(_,i)=>parseFloat($('#'+p+i).value)),sel=(v,L)=>'<option value="">Sin cambio</option>'+L.map((t,i)=>`<option value="${i}"${v===i?' selected':''}>${t}</option>`).join('');
async function getA(){const ids=LP.filter(p=>p.completado).map(p=>p.id);if(!ids.length)throw new Error('Todavía no hay respondentes completos.');
 const rows=await api(`ef_respuestas?select=respondente_id,pregunta_id,valor&respondente_id=in.(${ids.join(',')})&limit=5000`),A={};rows.forEach(r=>{(A[r.respondente_id]=A[r.respondente_id]||{})[r.pregunta_id]=r.valor});return A}
async function calc(){const e=$('#ce');e.textContent='';try{
 const pf=gp('wf',5).map(x=>x/100),pe=gp('we',5).map(x=>x/100),pj=$('#wj').value.trim();
 for(const [w,n] of [[pf,'familia'],[pe,'empresa']]){if(w.some(x=>!(x>=.05&&x<=.5)))throw new Error('Pesos de '+n+': cada uno debe estar entre 5% y 50%.');if(Math.abs(w.reduce((a,b)=>a+b,0)-1)>.0005)throw new Error('Pesos de '+n+': deben sumar 100%.')}

 if(q){const lf=$('#olf').value,le=$('#ole').value,j=$('#oj').value.trim();ov={lf:lf===''?null:+lf,le:le===''?null:+le,just:j,at:new Date().toISOString()};

function radar(v,l,c){const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[100+r*Math.cos(a),100+r*Math.sin(a)]},ring=k=>[0,1,2,3,4].map(i=>pt(i,70*k).join(',')).join(' ');
 return `<svg viewBox="-10 5 220 195" style="width:100%;max-width:260px">${[.33,.67,1].map(k=>`<polygon points="${ring(k)}" fill="none" stroke="var(--bd)"/>`).join('')}<polygon points="${v.map((x,i)=>pt(i,70*x/100).join(',')).join(' ')}" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width="2"/>${l.map((t,i)=>{const[p,q]=pt(i,84);return `<text x="${p}" y="${q}" text-anchor="middle" font-size="8" fill="var(--mu)">${t}</text>`}).join('')}</svg>`}
function dash(d,R){const bars=(X,D)=>X.map((v,i)=>`<div class="mu" style="margin:6px 0 2px">${D[i][1]} · <b>${v.s.toFixed(0)}</b></div><div class="bar"><i style="width:${v.s}%;background:${CL[lv(v.s)]}"></i></div>`).join(''),all=[d.ac,...d.ex].sort((a,b)=>a[2]-b[2]);
 return `<h1 style="margin-top:24px">Diagnóstico</h1><p class="mu">Familia: ${d.nF} respondentes · Empresa: ${d.nE} respondentes</p>
 <div class="g2"><div class="c"><div class="mu">Termómetro Familiar</div><div class="big">${d.sf.toFixed(0)}</div>${bd(FL,d.lf)}${radar(d.F.map(v=>v.s),SH.fam,'var(--ac)')}${bars(d.F,DF)}</div><div class="c"><div class="mu">Salud Empresarial</div><div class="big">${d.se.toFixed(0)}</div>${bd(EL,d.le)}${radar(d.E.map(v=>v.s),SH.emp,'var(--y)')}${bars(d.E,DE)}</div></div>
 <div class="c">${d.br===null?'<b>Brecha de percepción no calculada</b><div class="mu">Se necesitan al menos 3 respondentes de familia para resguardar el anonimato.</div>':`<b>Brecha de percepción familiar: ${d.br.toFixed(0)}</b> <span class="mu">${d.br<=20?'alineadas':d.br<=40?'diferencias moderadas · conversación guiada':'realidades paralelas · intervención urgente'}</span><div class="th" style="margin:12px 0"><i style="left:${Math.min(d.br,100)}%"></i></div><div class="mu">${d.F.map((v,i)=>SH.fam[i]+' '+v.b.toFixed(0)).join(' · ')}</div>`}</div>
 <div class="c"><b>Matriz 3×3</b><table class="mx"><tr><th>Familia ↓ / Empresa →</th>${EL.map(e=>`<th>${e}</th>`).join('')}</tr>${[2,1,0].map(a=>`<tr><th>${FL[a]}</th>${[0,1,2].map(b=>`<td class="${a==d.lf&&b==d.le?'on':''}">${a==d.lf&&b==d.le?'● celda activa':''}</td>`).join('')}</tr>`).join('')}</table></div>
 ${ext(d)}
 <div class="c act"><div class="mu">Acción prioritaria</div><b style="font-size:16px">${esc(d.ac[0])}</b><div>Responsable: ${esc(d.ac[1])} · Plazo: ${d.ac[2]} días</div><div class="mu">Indicador: ${esc(d.ac[3])}</div></div>
 ${d.ex.length?`<div class="c"><b>Acciones adicionales (reglas de ajuste)</b>${d.ex.map(a=>`<div class="q"><b>${a[0]}</b><div class="mu">${a[1]} · ${a[2]} días · ${a[3]}</div></div>`).join('')}</div>`:''}
 <div class="c"><b>Próximos pasos</b>${all.map(a=>`<div class="q">${fd(Date.parse(R.fecha)+a[2]*864e5)} · <b>${esc(a[0].split(/[.?]/)[0])}</b><div class="mu">${esc(a[1])}</div></div>`).join('')}</div><div class="np"><button onclick="print()">Imprimir / PDF</button></div>`}
if(SB_KEY=='PEGAR_CLAVE_PUBLICA'||SB_URL=='PEGAR_URL_PROYECTO')$('#app').innerHTML='<p class="err">Falta configurar SB_KEY (clave pública) dentro de app.html.</p>';else go(TK?'home':'login');
</script></body></html>
